<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DragonPoint - Offline</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container" aria-labelledby="offlineTitle">
    <div class="card" style="text-align:center;max-width:640px;margin:120px auto 0;">
      <h2 id="offlineTitle" style="color:var(--neon-cyan)">Você está offline</h2>
      <p>Não conseguimos carregar os dados mais recentes. Verifique sua conexão e tente novamente.</p>
      <button type="button" onclick="location.reload()" aria-label="Tentar recarregar a aplicação">Tentar novamente</button>
    </div>
  </main>
</body>
</html>
